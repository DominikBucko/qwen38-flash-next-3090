name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python scripts/validate_repo.py
      - name: Unit tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax
        run: python -m compileall -q scripts runtime tests tools
      - name: Shell syntax
        run: bash -n scripts/*.sh tools/*.sh
